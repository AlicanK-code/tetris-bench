# Model entries for benchmark runs.
#
# This project runs local models only. The size ladder below is the experiment:
# the same model family at increasing sizes, so the question becomes whether the
# improvement loop lets a small model close on a larger one.
#
# `provider` picks a known provider (ollama, lmstudio, openai, anthropic), which
# supplies the base URL and the API-key environment variable. Override base_url
# for a remote Ollama box or a gateway.
#
# `pricing` is dollars per million tokens and lives here rather than in code, so
# a cost logged months ago stays explainable by the config that produced it.
# Local models are free, which is a fact about them, not a missing value --
# which is why the headline cost measures are tokens and wall-clock, not dollars.
#
# `seed` removes one source of variance, but it does NOT make a generation
# repeatable. Measured: two runs of a byte-identical prompt at temperature 0 with
# this seed still produced different functions on the 4B and the 30B. The seed is
# honoured; the cause is numerics, not sampling. Reproducibility must be measured
# per rung: the 14B is reproducible, the 4B and 30B are not. See docs/findings/.
#
# `timeout_seconds` is generous because these are thinking models: Qwen3 emits a
# long chain of thought before its answer, and on this prompt even the 4B rung
# takes over two minutes. The client's 120s default was being hit and retried
# three times, which looked like a hang. Thinking cannot be disabled through
# Ollama's OpenAI-compatible endpoint -- `think: false` only moves the reasoning
# into `content` -- so the budget has to absorb it.
#
# Pull these before a run, and check the tags against `ollama list`:
#   ollama pull qwen3:4b && ollama pull qwen3:8b
#   ollama pull qwen3:14b && ollama pull qwen3:30b-a3b

# --- what every rung on the ladder must share, and the one thing it must not ---
#
# `temperature`, `frequency_penalty`, `max_tokens` and `max_retries` are
# IDENTICAL on all four rungs, because a ladder comparison is only about model
# size if nothing else differs. These four were each added to the 14B alone,
# empirically, and leaving them there would have confounded size with sampling
# configuration: a 4B truncated at a different token budget than the 14B looks
# worse for a reason that has nothing to do with being a 4B.
#
#   temperature 0.7     chains do not work at 0 -- the sampler never draws from
#                       the RNG, so every chain returns one byte-identical
#                       generation. The first five-chain run paid 5.5 hours to
#                       learn this. See docs/findings/.
#   frequency_penalty   greedy decoding makes a repetition loop permanent.
#   max_tokens 14000    the budget. Must be equal across rungs or the comparison
#                       is between token allowances, not models.
#   max_retries 0       an identical request that overran once will overrun
#                       again, having already cost the wall-clock to find out.
#
# `timeout_seconds` is the exception and SHOULD differ: it is wall-clock for the
# same token budget, and the rungs generate at very different speeds. Measured
# steady-state output rate (Ollama's eval_count/eval_duration, which excludes
# model load): 4B 48.0 tok/s, 8B 25.5, 14B 14.4, 30B-a3b 57.2. The 30B is the
# *fastest* rung despite being the largest, because only ~3B of it is active.
# Each timeout below is the 14B's hard-won 2400s scaled by that ratio and
# rounded up, so every rung tolerates the same worst-case tokens/sec floor.

models:
  # --- the size ladder: Apple Silicon, 32GB, so ~30B at 4-bit is the ceiling ---
  - name: qwen3-4b
    provider: ollama
    model: qwen3:4b
    pricing: {input_per_million: 0, output_per_million: 0}
    # 3.3x the 14B's rate, so 2400/3.3 = 720s, rounded up.
    timeout_seconds: 900
    max_retries: 0
    frequency_penalty: 0.5
    max_tokens: 14000
    seed: 1
    temperature: 0.7

  - name: qwen3-8b
    provider: ollama
    model: qwen3:8b
    pricing: {input_per_million: 0, output_per_million: 0}
    # 1.8x the 14B's rate, so 2400/1.8 = 1356s, rounded up.
    timeout_seconds: 1500
    max_retries: 0
    frequency_penalty: 0.5
    max_tokens: 14000
    seed: 1
    temperature: 0.7

  - name: qwen3-14b
    provider: ollama
    model: qwen3:14b
    pricing: {input_per_million: 0, output_per_million: 0}
    # 2400s, and no retry at all. Measured on this rung: generation runs at
    # 8.9-11.5 output tokens/sec, so 1200s was a ceiling of only ~10,700-13,800
    # tokens against a longest-observed generation of 9,369 -- 1.1x to 1.5x
    # headroom on a thinking model whose trace length varies by a factor of two.
    # Iteration 4 of the first six-iteration run exceeded it twice and aborted
    # the run.
    #
    # Dropping the retry keeps the worst case per position at 2400s, exactly
    # what `1200s x 2 attempts` already permitted, while giving each generation
    # twice the room. A retry buys little here anyway: the request is identical
    # at temperature 0, so a generation that overran once will very likely
    # overrun again, having already cost 20 minutes to find out.
    timeout_seconds: 2400
    max_retries: 0

    # This rung loops. Iteration 4 of the first six-iteration run did not
    # terminate on three consecutive attempts (1200s, 1200s, 2400s), emitting
    # 22,223 tokens on the last one with 8,869 tokens of context still unused --
    # so nothing was forcing it to stop and nothing was going to. See the note on
    # `frequency_penalty` in clients/config.py for why greedy decoding makes a
    # loop permanent.
    frequency_penalty: 0.5

    # The backstop, and the reason this is not just a second guess at the
    # timeout. 14,000 tokens is 1.5x the longest generation that ever completed
    # here (9,369), and at the measured 8.9-11.5 tokens/sec it is reached in
    # 1,220-1,570s -- comfortably inside the 2400s deadline. So a generation that
    # still runs away now *returns*, truncated, and is recorded as an invalid
    # output with its token count, instead of raising and aborting the run with
    # nothing written. Three attempts have already cost 80 minutes of GPU and
    # produced no rows at all; that is the failure mode being fixed.
    max_tokens: 14000
    seed: 1

    # Above zero, and that is a deliberate break with the project's default.
    #
    # The reason is that `chains` does not work without it. At temperature 0 the
    # sampler takes the argmax at every step and never draws from the RNG, so
    # the per-chain seed has no random number to index: measured, three seeds at
    # temperature 0 return one byte-identical generation. The first five-chain
    # run proved it the expensive way -- chains 1-4 came back byte-identical,
    # four copies of one sample at four times the price.
    #
    # It costs less reproducibility than it appears to. A *fixed* seed still
    # gives bit-identical output here (verified at both 0.7 and 1.0), so
    # reproducibility moves from `prompt -> output` to `(prompt, seed) ->
    # output`, and chain k stays replayable from `seed + k`. The former was
    # already unavailable on this rung anyway: two byte-identical prompts at
    # temperature 0 produced different functions, from floating-point
    # non-associativity in parallel GPU reductions.
    #
    # 0.7 rather than 1.0 to diverge the chains while distorting code less.
    # Caveat: the repeat test used 120-token generations, and floating-point
    # divergence accumulates with length, so per-chain reproducibility at the
    # ~9,000 tokens a real generation takes is untested.
    # See docs/findings/seed-is-inert-at-temperature-zero.md.
    temperature: 0.7

  # Mixture-of-experts: 30B total, ~3B active, so it runs far faster than its
  # size suggests and fits comfortably in 32GB at 4-bit.
  - name: qwen3-30b
    provider: ollama
    model: qwen3:30b-a3b
    pricing: {input_per_million: 0, output_per_million: 0}
    # 4.0x the 14B's rate, so 2400/4.0 = 604s. Kept at 1200s rather than cut to
    # 900: `max_tokens` is the real backstop now, so a generous deadline costs
    # nothing unless something genuinely wedges, and this is the rung whose
    # throughput is least characterised on long contexts.
    timeout_seconds: 1200
    max_retries: 0
    frequency_penalty: 0.5
    max_tokens: 14000
    seed: 1
    temperature: 0.7

