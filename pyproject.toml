[project]
name = "tetris-bench"
version = "0.1.0"
description = "A benchmark measuring how well LLMs improve at Tetris across repeated attempts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Added at the milestone that needs them, so early stages install fast
# and the engine provably depends on nothing.
llm = ["openai>=1.40", "pyyaml>=6.0"]
analysis = ["pandas>=2.2", "matplotlib>=3.9"]

[project.scripts]
tetris-bench = "tetris_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tetris_bench"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Two kinds of Markdown hold Python that must not be reformatted:
#   - prompt templates are data a model reads, and rewriting the code in their
#     fences silently changes the instructions it is given;
#   - findings documents quote model-written code as evidence, so reformatting it
#     misrepresents what the model actually produced.
# `ruff format` rewrites Python inside Markdown fences, so both are excluded.
extend-exclude = ["src/tetris_bench/prompts/", "docs/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
